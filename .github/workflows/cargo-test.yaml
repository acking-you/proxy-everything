name: cargo-clippy-test

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          components: clippy, rustfmt
      - name: cargo fmt
        run: cargo fmt -p proxy-crypto -p proxy-core -p proxy-client -p proxy-server -p proxy-tui -p proxy-ffi -p proxy-updater -p proxy-ui-services -p galaxy-geometry -- --check
      - name: cargo clippy
        run: cargo clippy -p proxy-crypto -p proxy-core -p proxy-client -p proxy-server -p proxy-tui -p proxy-ffi -p proxy-updater -p proxy-ui-services -p galaxy-geometry --all-targets --all-features --no-deps --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Check client without automatic routing
        run: cargo check -p proxy-client --no-default-features --locked
      - name: Check iOS FFI compatibility
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-ios
          cargo check -p proxy-ffi --features network-extension --target aarch64-apple-ios --locked
      - name: Test release completeness checks
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: integration test
        if: matrix.os == 'ubuntu-latest'
        run: scripts/integration-test.sh
      - name: cargo build
        run: cargo build --workspace --release --locked

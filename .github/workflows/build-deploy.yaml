name: build and deploy
run-name: Native ${{ inputs.release_version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Native library release version, such as 0.4.30'
        required: true
        type: string
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-binaries:
    # Every native release includes freshly built CLI/server/admin/TUI artifacts.
    name: Build binaries
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - build: x86_64-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          # Linux ARM64
          - build: aarch64-linux-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl

          # Linux ARMv7
          - build: armv7-linux-musl
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabi

          # Linux s390x
          - build: s390x-linux-gnu
            os: ubuntu-latest
            target: s390x-unknown-linux-gnu

          # macOS x86_64
          - build: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin

          # macOS ARM64
          - build: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin

          # Windows x86_64
          - build: x86_64-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc

          # Windows ARM64
          - build: aarch64-windows-msvc
            os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Get the release version from the tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric release version"
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          targets: ${{ matrix.target }}

      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --version 0.2.5 --locked

      - name: Build all release binaries
        shell: bash
        run: |
          builder=cargo
          if [ "$RUNNER_OS" = Linux ]; then builder=cross; fi
          "$builder" build --locked --release --target '${{ matrix.target }}' \
            -p proxy-server -p proxy-client -p proxy-tui \
            --bin http-proxy-server --bin http-proxy-cli --bin http-proxy-admin --bin proxy-tui

      - name: Archive binaries
        shell: bash
        run: |
          for binary_name in http-proxy-cli http-proxy-server http-proxy-admin proxy-tui; do
            dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
            mkdir -p "$dirname"
            printf '{"version":"%s","source_commit":"%s","target":"%s","component":"%s"}\n' \
              "$VERSION" "$GITHUB_SHA" '${{ matrix.target }}' "$binary_name" > "$dirname/build-info.json"
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname/"
              if [ "$binary_name" = "http-proxy-cli" ]; then
                cp "target/${{ matrix.target }}/release/wintun.dll" "$dirname/"
              fi
            else
              cp "target/${{ matrix.target }}/release/$binary_name" "$dirname/"
            fi
          done

          # Create archives
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            for binary_name in http-proxy-cli http-proxy-server http-proxy-admin proxy-tui; do
              dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
              if [ -d "$dirname" ] && [ "$(ls -A $dirname)" ]; then
                7z a "$dirname.zip" "$dirname"
              fi
            done
          else
            for binary_name in http-proxy-cli http-proxy-server http-proxy-admin proxy-tui; do
              dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
              if [ -d "$dirname" ] && [ "$(ls -A $dirname)" ]; then
                tar -czf "$dirname.tar.gz" "$dirname"
              fi
            done
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.zip

  build-ffi-libs:
    name: Build FFI libraries
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          # Match the Flutter Linux bundle's glibc baseline.
          - build: x86_64-linux-gnu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          # Linux ARM64
          - build: aarch64-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # macOS x86_64
          - build: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin

          # macOS ARM64
          - build: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin

          # iOS ARM64
          - build: aarch64-ios
            os: macos-latest
            target: aarch64-apple-ios

          # iOS Simulator x86_64
          - build: x86_64-ios-sim
            os: macos-latest
            target: x86_64-apple-ios

          # iOS Simulator ARM64
          - build: aarch64-ios-sim
            os: macos-latest
            target: aarch64-apple-ios-sim

          # Android ARM64
          - build: aarch64-android
            os: ubuntu-latest
            target: aarch64-linux-android

          # Android ARMv7
          - build: armv7-android
            os: ubuntu-latest
            target: armv7-linux-androideabi

          # Android x86_64
          - build: x86_64-android
            os: ubuntu-latest
            target: x86_64-linux-android

          # Windows x86_64
          - build: x86_64-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

          # Windows ARM64
          - build: aarch64-windows
            os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Get the release version from the tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric release version"
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: contains(matrix.os, 'ubuntu') && contains(matrix.target, 'aarch64-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1.6.0
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set Android NDK environment
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "NDK_HOME=$NDK"
            # Set CC and linker for each Android target
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=$TOOLCHAIN/armv7a-linux-androideabi24-clang"
            echo "AR_armv7_linux_androideabi=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi24-clang"
            echo "CC_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android24-clang"
            echo "AR_x86_64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android24-clang"
          } >> "$GITHUB_ENV"

      - name: Install cross for Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --version 0.2.5 --locked

      - name: Build FFI library
        shell: bash
        run: |
          builder=cargo
          if [ '${{ matrix.target }}' = aarch64-unknown-linux-gnu ]; then builder=cross; fi
          "$builder" build -p proxy-ffi --verbose --locked --release --target '${{ matrix.target }}'

      # macOS TUN requires an elevated helper alongside the FFI library.
      - name: Build privileged TUN helper
        if: contains(matrix.target, 'apple-darwin')
        run: cargo build -p proxy-client --bin http-proxy-tun-helper --verbose --locked --release --target ${{ matrix.target }}

      - name: Archive FFI library
        shell: bash
        run: |
          dirname="libhttp_proxy-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir -p "$dirname"
          printf '{"version":"%s","source_commit":"%s","target":"%s","component":"libhttp_proxy"}\n' \
            "$VERSION" "$GITHUB_SHA" '${{ matrix.target }}' > "$dirname/build-info.json"

          # Copy static library
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/http_proxy.lib" "$dirname/"
            cp "target/${{ matrix.target }}/release/http_proxy.dll" "$dirname/"
            cp "target/${{ matrix.target }}/release/http_proxy.dll.lib" "$dirname/" 2>/dev/null || true
            cp "target/${{ matrix.target }}/release/wintun.dll" "$dirname/"
          else
            cp "target/${{ matrix.target }}/release/libhttp_proxy.a" "$dirname/"
            cp "target/${{ matrix.target }}/release/libhttp_proxy.so" "$dirname/" 2>/dev/null || true
            cp "target/${{ matrix.target }}/release/libhttp_proxy.dylib" "$dirname/" 2>/dev/null || true
          fi

          # Fail loudly rather than shipping a macOS archive whose TUN switch
          # can only ever report a missing helper.
          case "${{ matrix.target }}" in
            *apple-darwin)
              cp "target/${{ matrix.target }}/release/http-proxy-tun-helper" "$dirname/"
              ;;
          esac

          # Create archive
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
          else
            tar -czf "$dirname.tar.gz" "$dirname"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ffi-${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-ffi-libs]
    if: ${{ !cancelled() && needs.build-ffi-libs.result == 'success' && needs.build-binaries.result == 'success' }}

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Get the release version from the tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric release version"
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Verify complete release and generate checksums
        run: python3 scripts/release/verify-native-assets.py release "$VERSION" "$GITHUB_SHA"

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: release/*

  docker-build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event_name == 'push' && needs.release.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Get version from tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric release version"
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download x86_64 binary
        run: |
          gh release download ${{ env.VERSION }} -p "http-proxy-server-*-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf http-proxy-server-*-x86_64-unknown-linux-musl.tar.gz
          mkdir -p docker/linux-amd64
          mv http-proxy-server-*/http-proxy-server docker/linux-amd64/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download aarch64 binary
        run: |
          gh release download ${{ env.VERSION }} -p "http-proxy-server-*-aarch64-unknown-linux-musl.tar.gz"
          tar -xzf http-proxy-server-*-aarch64-unknown-linux-musl.tar.gz
          mkdir -p docker/linux-arm64
          mv http-proxy-server-*/http-proxy-server docker/linux-arm64/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./docker
          file: ./docker/http2-server.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ackingliu/http2-server:${{ env.VERSION }}
            ackingliu/http2-server:latest

name: build and deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and upload
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # You can add more, for any target you'd like!
        include:
          - build: x86_64-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: armv7-linux-musl
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabi

          - build: s390x-linux-gnu
            os: ubuntu-latest
            target: s390x-unknown-linux-gnu

          - build: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: x86_64-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - build: aarch64-unknown-linux-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get the release version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build http-proxy-server
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --bin http-proxy-server --verbose --release --target ${{ matrix.target }}

      - name: Build http-proxy-client
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --bin http-proxy-client --verbose --release --target ${{ matrix.target }}

      - name: Build http-proxy-cli
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --bin http-proxy-cli --features cli-dep --verbose --release --target ${{ matrix.target }}

      - name: Archive http-proxy-cli
        shell: bash
        run: |
          # Replace with the name of your binary
          binary_name="http-proxy-cli"

          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname"
          else
            mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "CLI_ASSET=$dirname.zip" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "CLI_ASSET=$dirname.tar.gz" >> $GITHUB_ENV
          fi

      - name: Archive http-proxy-client
        shell: bash
        run: |
          # Replace with the name of your binary
          binary_name="http-proxy-client"

          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname"
          else
            mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "CLIENT_ASSET=$dirname.zip" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "CLIENT_ASSET=$dirname.tar.gz" >> $GITHUB_ENV
          fi

      - name: Archive http-proxy-server
        shell: bash
        run: |
          # Replace with the name of your binary
          binary_name="http-proxy-server"

          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname"
          else
            mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "SERVER_ASSET=$dirname.zip" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "SERVER_ASSET=$dirname.tar.gz" >> $GITHUB_ENV
          fi

      - name: Release binary
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.SERVER_ASSET }}
            ${{ env.CLIENT_ASSET }}
            ${{ env.CLI_ASSET }}

  docker-build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download x86_64 binary
        run: |
          gh release download ${{ env.VERSION }} -p "http-proxy-server-*-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf http-proxy-server-*-x86_64-unknown-linux-musl.tar.gz
          mkdir -p docker/linux-amd64
          mv http-proxy-server-*/http-proxy-server docker/linux-amd64/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download aarch64 binary
        run: |
          gh release download ${{ env.VERSION }} -p "http-proxy-server-*-aarch64-unknown-linux-musl.tar.gz"
          tar -xzf http-proxy-server-*-aarch64-unknown-linux-musl.tar.gz
          mkdir -p docker/linux-arm64
          mv http-proxy-server-*/http-proxy-server docker/linux-arm64/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/http2-server.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ackingliu/http2-server:${{ env.VERSION }}
            ackingliu/http2-server:latest

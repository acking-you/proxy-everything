name: build and deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - build: x86_64-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          # Linux ARM64
          - build: aarch64-linux-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl

          # Linux ARMv7
          - build: armv7-linux-musl
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabi

          # Linux s390x
          - build: s390x-linux-gnu
            os: ubuntu-latest
            target: s390x-unknown-linux-gnu

          # macOS x86_64
          - build: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin

          # macOS ARM64
          - build: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin

          # Windows x86_64
          - build: x86_64-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc

          # Windows ARM64
          - build: aarch64-windows-msvc
            os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get the release version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          targets: ${{ matrix.target }}

      - name: Build http-proxy-server
        uses: actions-rs/cargo@v1
        with:
          use-cross: ${{ !contains(matrix.os, 'macos') && !contains(matrix.os, 'windows') }}
          command: build
          args: -p proxy-server --bin http-proxy-server --verbose --release --target ${{ matrix.target }}

      - name: Build http-proxy-cli
        uses: actions-rs/cargo@v1
        with:
          use-cross: ${{ !contains(matrix.os, 'macos') && !contains(matrix.os, 'windows') }}
          command: build
          args: -p proxy-client --bin http-proxy-cli --verbose --release --target ${{ matrix.target }}

      - name: Archive binaries
        shell: bash
        run: |
          for binary_name in http-proxy-cli http-proxy-server; do
            dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
            mkdir -p "$dirname"
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname/" 2>/dev/null || true
            else
              cp "target/${{ matrix.target }}/release/$binary_name" "$dirname/" 2>/dev/null || true
            fi
          done

          # Create archives
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            for binary_name in http-proxy-cli http-proxy-server; do
              dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
              if [ -d "$dirname" ] && [ "$(ls -A $dirname)" ]; then
                7z a "$dirname.zip" "$dirname"
              fi
            done
          else
            for binary_name in http-proxy-cli http-proxy-server; do
              dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
              if [ -d "$dirname" ] && [ "$(ls -A $dirname)" ]; then
                tar -czf "$dirname.tar.gz" "$dirname"
              fi
            done
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  build-ffi-libs:
    name: Build FFI libraries
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - build: x86_64-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux ARM64
          - build: aarch64-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # macOS x86_64
          - build: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin

          # macOS ARM64
          - build: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin

          # iOS ARM64
          - build: aarch64-ios
            os: macos-latest
            target: aarch64-apple-ios

          # iOS Simulator x86_64
          - build: x86_64-ios-sim
            os: macos-latest
            target: x86_64-apple-ios

          # iOS Simulator ARM64
          - build: aarch64-ios-sim
            os: macos-latest
            target: aarch64-apple-ios-sim

          # Android ARM64
          - build: aarch64-android
            os: ubuntu-latest
            target: aarch64-linux-android

          # Android ARMv7
          - build: armv7-android
            os: ubuntu-latest
            target: armv7-linux-androideabi

          # Android x86_64
          - build: x86_64-android
            os: ubuntu-latest
            target: x86_64-linux-android

          # Windows x86_64
          - build: x86_64-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

          # Windows ARM64
          - build: aarch64-windows
            os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get the release version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: contains(matrix.os, 'ubuntu') && contains(matrix.target, 'aarch64-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set Android NDK environment
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK" >> $GITHUB_ENV
          # Set CC and linker for each Android target
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CC_armv7_linux_androideabi=$TOOLCHAIN/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          echo "AR_armv7_linux_androideabi=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          echo "CC_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_x86_64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android24-clang" >> $GITHUB_ENV

      - name: Build FFI library
        uses: actions-rs/cargo@v1
        with:
          use-cross: ${{ !contains(matrix.target, 'android') && contains(matrix.os, 'ubuntu') && contains(matrix.target, 'aarch64') }}
          command: build
          args: -p proxy-ffi --verbose --release --target ${{ matrix.target }}

      - name: Archive FFI library
        shell: bash
        run: |
          dirname="libhttp_proxy-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir -p "$dirname"

          # Copy static library
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/http_proxy.lib" "$dirname/" 2>/dev/null || true
            cp "target/${{ matrix.target }}/release/http_proxy.dll" "$dirname/" 2>/dev/null || true
            cp "target/${{ matrix.target }}/release/http_proxy.dll.lib" "$dirname/" 2>/dev/null || true
          else
            cp "target/${{ matrix.target }}/release/libhttp_proxy.a" "$dirname/" 2>/dev/null || true
            cp "target/${{ matrix.target }}/release/libhttp_proxy.so" "$dirname/" 2>/dev/null || true
            cp "target/${{ matrix.target }}/release/libhttp_proxy.dylib" "$dirname/" 2>/dev/null || true
          fi

          # Create archive
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
          else
            tar -czf "$dirname.tar.gz" "$dirname"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-ffi-libs]
    if: ${{ !cancelled() }}

    steps:
      - name: Get the release version from the tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*

  docker-build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download x86_64 binary
        run: |
          gh release download ${{ env.VERSION }} -p "http-proxy-server-*-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf http-proxy-server-*-x86_64-unknown-linux-musl.tar.gz
          mkdir -p docker/linux-amd64
          mv http-proxy-server-*/http-proxy-server docker/linux-amd64/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download aarch64 binary
        run: |
          gh release download ${{ env.VERSION }} -p "http-proxy-server-*-aarch64-unknown-linux-musl.tar.gz"
          tar -xzf http-proxy-server-*-aarch64-unknown-linux-musl.tar.gz
          mkdir -p docker/linux-arm64
          mv http-proxy-server-*/http-proxy-server docker/linux-arm64/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/http2-server.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ackingliu/http2-server:${{ env.VERSION }}
            ackingliu/http2-server:latest

[package]
name = "proxy-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proxy-core = { path = "../proxy-core", features = ["cli-dep"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }
clap = { workspace = true }
sysproxy = { workspace = true }
toml = { workspace = true }
crossterm = { workspace = true }
comfy-table = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
uni-stream = { workspace = true }
base64 = { workspace = true }
tun2proxy = { workspace = true }

# auto-proxy dependencies
hashbrown = { workspace = true, optional = true }
kanal = { workspace = true, optional = true }
async-broadcast = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18"
sysinfo = { workspace = true }
winreg = "0.52"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["auto-proxy"]
auto-proxy = ["proxy-core/auto-proxy", "dep:hashbrown", "dep:kanal", "dep:async-broadcast", "dep:dashmap"]

[[bin]]
name = "http-proxy-cli"
path = "src/bin/main.rs"

# Privileged macOS TUN helper. Built on every platform so a cross-platform
# `cargo build` stays uniform; elsewhere it only reports that it is unsupported.
[[bin]]
name = "http-proxy-tun-helper"
path = "src/bin/tun_helper.rs"

[dev-dependencies]
proxy-server = { path = "../proxy-server" }

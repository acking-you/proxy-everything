[package]
name = "proxy-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "http_proxy"
crate-type = ["staticlib", "cdylib"]

[dependencies]
galaxy-geometry = { path = "../galaxy-geometry" }
proxy-core = { path = "../proxy-core" }
proxy-client = { path = "../proxy-client" }
proxy-updater = { path = "../proxy-updater" }
proxy-ui-services = { path = "../proxy-ui-services" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
sysproxy = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[features]
network-extension = ["proxy-client/network-extension"]
mac-app-store = ["network-extension", "proxy-core/no-external-geo"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[workspace]
resolver = "2"
members = [
    "crates/proxy-core",
    "crates/proxy-client",
    "crates/proxy-server",
    "crates/proxy-tui",
    "crates/proxy-ffi",
]
exclude = [
    "deps/kanal",
    "deps/sysproxy-rs",
]

[workspace.package]
version = "0.4.17"
edition = "2024"
license = "MIT"
repository = "https://github.com/acking-you/proxy-everything"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Error handling
snafu = "0.8.9"
anyhow = "1.0.100"

# Crypto
ring = "0.17.14"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"], default-features = true }

# Concurrency
dashmap = "6.1.0"
arc-swap = "1.8.0"
once_cell = "1.21.3"

# Collections
indexmap = "2"
hashbrown = "0.16.1"
lru = "0.16"

# Async utilities
futures = "0.3"
async-broadcast = "0.7"

# Network
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uni-stream = "0.1.0"

# Geo
maxminddb = "0.27"
flate2 = "1.1"

# CLI
clap = { version = "4.5.54", features = ["derive", "env"] }
crossterm = "0.29"
indicatif = "0.18"
comfy-table = "7"

# TUI
ratatui = "0.30"
chrono = "0.4"

# System
dirs = "6"
sysinfo = "0.37"

# Memory allocator
mimalloc-rust = "0.2"

# Random
rand = "0.9"

# Local dependencies
kanal = { path = "deps/kanal" }
sysproxy = { path = "deps/sysproxy-rs" }

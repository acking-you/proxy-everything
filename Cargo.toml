[package]
name = "http-proxy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7.10", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.7.5"
ring = "0.17.5"
once_cell = "1.18.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
clap = { version = "4.4.8", features = ["derive"], optional = true }
rand = "0.8.5"
monoio = { version = "0.2.0", default-features = false, features = [
    "async-cancel",
    "sync",
    "bytes",
    "iouring",
    "legacy",
    "macros",
    "utils",
], optional = true }
hashbrown = { version = "0.14.3", optional = true }
dashmap = { version = "5.5.3", optional = true }
async-broadcast = { version = "0.6.0", optional = true }
flume = { version = "0.11.0", default-features = false, features = [
    "async",
], optional = true }
futures = "0.3"
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"

[[bin]]
name = "http-proxy-client"
path = "src/bin/client-bin.rs"
[[bin]]
name = "http-proxy-server"
path = "src/bin/server-bin.rs"
[[bin]]
name = "http-proxy-cli"
path = "src/bin/http-proxy-cli.rs"
required-features = ["cli-dep"]

[features]
default = ["tokio", "auto-proxy"]
tokio = ["dep:tokio", "dep:tokio-util"]
monoio = ["dep:monoio"]
cli-dep = ["dep:clap"]
auto-proxy = [
    "dep:hashbrown",
    "dep:flume",
    "dep:dashmap",
    "dep:async-broadcast",
]

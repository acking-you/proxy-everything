[package]
name = "http-proxy"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7.10", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.7.5"
ring = "0.17.8"
once_cell = "1.18.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
    "fmt",
], default-features = true }
clap = { version = "4.4.8", features = ["derive", "env"], optional = true }
rand = "0.8.5"
hashbrown = { version = "0.14.3", optional = true }
dashmap = { version = "5.5.3", optional = true }
async-broadcast = { version = "0.6.0", optional = true }
flume = { version = "0.11.0", default-features = false, features = [
    "async",
], optional = true }
futures = "0.3"
mimalloc-rust = "0.2"
anyhow = "1.0.86"
uni-stream = "0.1.0"
lru = "0.12"
dirs = "5"
sysinfo = "0.32"
sysproxy = { path = "deps/sysproxy-rs", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
chrono = { version = "0.4", optional = true }

[[bin]]
name = "http-proxy-client"
path = "src/bin/client-bin.rs"
[[bin]]
name = "http-proxy-server"
path = "src/bin/server-bin.rs"
[[bin]]
name = "http-proxy-cli"
path = "src/bin/http-proxy-cli.rs"
required-features = ["cli-dep"]
[[bin]]
name = "http-proxy-admin"
path = "src/bin/http-proxy-admin.rs"
required-features = ["cli-dep"]
[[bin]]
name = "proxy-tui"
path = "src/bin/proxy-tui.rs"
required-features = ["tui"]

[features]
default = ["tokio", "auto-proxy", "cli-dep", "tui"]
tokio = ["dep:tokio", "dep:tokio-util"]
cli-dep = ["dep:clap", "dep:sysproxy"]
tui = ["dep:ratatui", "dep:crossterm", "dep:clap", "dep:chrono"]
auto-proxy = [
    "dep:hashbrown",
    "dep:flume",
    "dep:dashmap",
    "dep:async-broadcast",
]

[dev-dependencies]
serial_test = "3"

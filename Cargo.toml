[package]
name = "http-proxy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.7.5"
ring = "0.17.5"
once_cell = "1.18.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
clap = { version = "4.4.8", features = ["derive"], optional = true }
rand = "0.8.5"
monoio = { version = "0.2.0", default-features = false, features = [
    "async-cancel",
    "sync",
    "bytes",
    "iouring",
    "legacy",
    "macros",
    "utils",
], optional = true }
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"
futures = "0.3"

[[bin]]
name = "http-proxy-client"
path = "src/client-bin.rs"
[[bin]]
name = "http-proxy-server"
path = "src/server-bin.rs"
[[bin]]
name = "http-proxy-cli"
path = "src/http-proxy-cli.rs"
required-features = ["cli-dep"]

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
monoio = ["dep:monoio"]
cli-dep = ["dep:clap"]

[workspace]
resolver = "2"
members = [
    "crates/proxy-core",
    "crates/proxy-client",
    "crates/proxy-server",
    "crates/proxy-tui",
    "crates/proxy-ffi",
]
exclude = [
    "deps/kanal",
    "deps/uni-stream",
    "deps/sysproxy-rs",
    "deps/tun2proxy",
    "deps/ipstack",
]

[workspace.package]
version = "0.4.38"
edition = "2024"
license = "MIT"
repository = "https://github.com/acking-you/proxy-everything"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Error handling
snafu = "0.9.2"
anyhow = "1.0.104"

# Crypto
ring = "0.17.14"

# Logging
tracing = "0.1.44"
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
], default-features = true }

# Concurrency
dashmap = "6.2.1"
arc-swap = "1.9.2"
once_cell = "1.21.4"
parking_lot = "0.12"

# Collections
indexmap = "2"
hashbrown = "0.17.1"
lru = "0.18"
moka = { version = "0.12.16", features = ["sync"] }

# Async utilities
futures = "0.3"
async-broadcast = "0.7"

# Network
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "stream",
] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tokio-socks = "0.5.3"
uni-stream = { path = "deps/uni-stream" }

# Geo
maxminddb = "0.32"
flate2 = "1.1"

# Encoding
base64 = "0.23"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29"
indicatif = "0.18"
comfy-table = "8"

# TUI
ratatui = "0.30"
chrono = "0.4"

# System
dirs = "7"
# sysinfo 0.39 uses cfg_select, not stabilized in the pinned January nightly.
sysinfo = "0.38"

# Memory allocator
better_mimalloc_rs = { path = "deps/better_mimalloc_rs", features = ["config"] }

# Random
rand = "0.10"

# Local dependencies
kanal = { path = "deps/kanal" }
sysproxy = { path = "deps/sysproxy-rs" }
smallvec = { path = "deps/rust-smallvec", features = ["std"] }
tun2proxy = { path = "deps/tun2proxy", default-features = false }
# `deps/ipstack` has no entry here on purpose: nothing in the workspace uses it
# directly. `tun2proxy` depends on it by path, which is what pulls the fork into
# the build.
